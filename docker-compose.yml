version: '3.8'

services:
  # Web application service running PHP + Apache
  web:
    build: .
    container_name: todo_web_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: todo_app
      DB_USER: todo_user
      DB_PASS: todo_password
      APP_ENV: production
    depends_on:
      - db

  # Relational Database service running MySQL 8.0
  db:
    image: mysql:8.0
    container_name: todo_mysql_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: todo_app
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_password
    ports:
      - "3307:3306"
    volumes:
      - todo_db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  todo_db_data:
